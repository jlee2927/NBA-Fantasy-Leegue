<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NBA Fantasy Leegue{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23e87840'/><g stroke='%23171b17' stroke-width='2' fill='none'><circle cx='16' cy='16' r='15'/><path d='M16 1v30M1 16h30'/><path d='M5 5a21 21 0 0 0 22 22M27 5A21 21 0 0 1 5 27'/></g></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='room.css') }}">
</head>
<body>

{# A regulation half court, drawn to scale: ten units to the foot, so the key
   is 160 by 190 and the arc is 237.5 from the basket. No team markings, which
   keeps it clear of anybody's trademarks. #}
<div class="court" aria-hidden="true">
  <svg viewBox="-20 -40 540 530" preserveAspectRatio="xMidYMid slice">
    <rect class="paint" x="170" y="280" width="160" height="190"/>
    <g class="lines">
      <path d="M0 0 H500"/>
      <circle cx="250" cy="0" r="60"/>
      <rect x="170" y="280" width="160" height="190"/>
      <circle cx="250" cy="280" r="60"/>
      <path d="M30 470 V330 A237.5 237.5 0 0 1 470 330 V470"/>
      <path d="M220 430 H280"/>
      <path d="M210 417.5 A40 40 0 0 1 290 417.5"/>
      <circle cx="250" cy="417.5" r="7.5"/>
    </g>
  </svg>
</div>

<div class="site-bar">
  <div class="inner">
    <a class="brand" href="/">
      <span class="brand-mark"><span></span></span>
      <span>NBA FANTASY <span class="brand-accent">LEEGUE.</span></span>
    </a>
    <a class="back" href="/#method">
      THE METHODOLOGY &nearr;
    </a>
  </div>
</div>

<div class="wrap">{% block body %}{% endblock %}</div>
</body>
</html>
